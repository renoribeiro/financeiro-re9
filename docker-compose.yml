# =============================================================================
# RE9 Finanças — deploy no Dokploy (VPS Hostinger), modo Compose + Traefik.
#
# Mesmo padrão do seu stack WAHA/Evolution: o Traefik do Dokploy (já instalado
# na VPS) roteia o domínio para a porta 3000 do container e emite o SSL via
# Let's Encrypt (certresolver "letsencrypt"). Não há serviço Traefik aqui — ele
# é provido pelo Dokploy, igual ao seu docker-compose do Evolution.
#
# Os dados são persistidos no Supabase. URL e chave pública são obrigatórias;
# integrações administrativas/fiscais exigem também seus segredos server-side.
#
# ATENCAO: ajuste o dominio abaixo e mantenha os nomes de router/service
#          ("financeiro-re9") UNICOS entre todos os apps do seu Traefik.
# =============================================================================
services:
  app:
    # Puxa a imagem publicada no GitHub Packages (GHCR) — sem buildar na VPS.
    # Publicada pelo workflow .github/workflows/publish-ghcr.yml a cada push.
    image: ghcr.io/renoribeiro/financeiro-re9:latest

    # (Alternativa) buildar na própria VPS a partir do Dockerfile do repo:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    expose:
      - "3000"

    labels:
      - traefik.enable=true
      - traefik.http.routers.financeiro-re9.rule=Host(`financas.re9imob.com.br`)
      - traefik.http.routers.financeiro-re9.entrypoints=websecure
      - traefik.http.routers.financeiro-re9.tls.certresolver=letsencrypt
      - traefik.http.services.financeiro-re9.loadbalancer.server.port=3000

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_PORT: 3000
      # Preencha na aba "Environment" do Dokploy (não versione segredos aqui).
      # NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL}
      # NUXT_PUBLIC_SUPABASE_KEY: ${NUXT_PUBLIC_SUPABASE_KEY}
      # NUXT_SUPABASE_SECRET_KEY: ${NUXT_SUPABASE_SECRET_KEY}
      # GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID}
      # GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET}
      # GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI}
      # GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY}
      # NFSE_ENABLED: ${NFSE_ENABLED}
      # NFSE_AMBIENTE: ${NFSE_AMBIENTE}
      # NFSE_CERT_PFX_BASE64: ${NFSE_CERT_PFX_BASE64}
      # NFSE_CERT_PASSWORD: ${NFSE_CERT_PASSWORD}

    restart: unless-stopped

# =============================================================================
# Teste local (sem Dokploy/Traefik): descomente o bloco de portas e rode
#   docker compose up --build
# depois acesse http://localhost:3000
# =============================================================================
#   app:
#     ports:
#       - "3000:3000"
